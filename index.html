<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>JMKCC Mega Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Poppins',sans-serif;background:#0f172a;color:#f8fafc;padding:16px;padding-bottom:50px;}
.header{text-align:center;margin-bottom:16px;padding-top:10px;}
.header h1{font-size:22px;font-weight:800;color:#fff;}
.header p{font-size:12px;color:#94a3b8;font-weight:500;}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:16px;}
.card h3{font-size:13px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #334155;padding-bottom:8px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.subject-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #334155;}
.subject-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.subject-name{grid-column:span 3;font-size:13px;font-weight:700;color:#fff;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.btn{padding:12px 8px;border-radius:10px;border:none;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:all 0.15s;color:#fff;text-align:center;}
.btn:active{transform:scale(0.95);}
.btn i{font-size:16px;}
.bg-green{background:#16a34a;}
.bg-red{background:#dc2626;}
.bg-blue{background:#2563eb;}
.bg-dark{background:#475569;}
.bg-amber{background:#d97706;}
.bg-purple{background:#7c3aed;}
.btn-full{grid-column:span 2;}
.input-group{margin-bottom:12px;}
.input-group label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;}
.input-group input{width:100%;height:46px;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:0 14px;color:#fff;font-size:14px;font-family:inherit;outline:none;}
.input-group input:focus{border-color:#3b82f6;}

/* Telegram Main Button */
.tg-main-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#229ED9,#0e7490);color:#fff;padding:14px;border-radius:12px;font-weight:800;font-size:16px;margin-bottom:16px;text-decoration:none;box-shadow:0 4px 14px rgba(34,158,217,.3);}
.tg-main-btn:active{transform:scale(.98);}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#22c55e;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:all 0.3s;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,0.5);display:flex;align-items:center;gap:8px;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<div class="header">
  <h1><i class="fas fa-shield-halved" style="color:#22c55e"></i> Mega Admin Panel</h1>
  <p>60+ Direct Commands</p>
</div>

<!-- DIRECT TELEGRAM BOT LINK -->
<a href="https://t.me/Mathsmatic_bot" target="_blank" class="tg-main-btn">
  <i class="fab fa-telegram" style="font-size:22px;"></i> Open Telegram Bot
</a>

<!-- 1. MASTER CONTROLS -->
<div class="card">
  <h3><i class="fas fa-crown"></i> Master Controls</h3>
  <div class="grid">
    <button class="btn bg-green btn-full" onclick="handleAction('/starttest all')"><i class="fas fa-rocket"></i> Start ALL Tests</button>
    <button class="btn bg-red btn-full" onclick="handleAction('/stoptest all')"><i class="fas fa-power-off"></i> Stop ALL Tests</button>
    <button class="btn bg-blue btn-full" onclick="handleAction('/cleartest all')"><i class="fas fa-unlock"></i> Clear ALL Locks</button>
    <button class="btn bg-dark btn-full" onclick="handleAction('/teststatus')"><i class="fas fa-chart-line"></i> Check All Status</button>
    <button class="btn bg-amber" onclick="handleAction('/maintenance on')"><i class="fas fa-tools"></i> Maint. ON</button>
    <button class="btn bg-green" onclick="handleAction('/maintenance off')"><i class="fas fa-check"></i> Maint. OFF</button>
    <button class="btn bg-purple btn-full" onclick="handleAction('/forceupdate')"><i class="fas fa-sync"></i> Force App Update</button>
  </div>
</div>

<!-- 2. SUBJECT-WISE TEST CONTROL -->
<div class="card">
  <h3><i class="fas fa-file-alt"></i> Subject-wise Control</h3>
  <div class="subject-row">
    <div class="subject-name"><i class="fas fa-square-root-alt" style="color:#3b82f6"></i> Maths</div>
    <button class="btn bg-green" onclick="handleAction('/starttest maths')">ON</button>
    <button class="btn bg-red" onclick="handleAction('/stoptest maths')">OFF</button>
    <button class="btn bg-dark" onclick="handleAction('/cleartest maths')">Clear</button>
  </div>
  <div class="subject-row">
    <div class="subject-name"><i class="fas fa-atom" style="color:#8b5cf6"></i> Physics</div>
    <button class="btn bg-green" onclick="handleAction('/starttest physics')">ON</button>
    <button class="btn bg-red" onclick="handleAction('/stoptest physics')">OFF</button>
    <button class="btn bg-dark" onclick="handleAction('/cleartest physics')">Clear</button>
  </div>
  <div class="subject-row">
    <div class="subject-name"><i class="fas fa-flask" style="color:#10b981"></i> Chemistry</div>
    <button class="btn bg-green" onclick="handleAction('/starttest chemistry')">ON</button>
    <button class="btn bg-red" onclick="handleAction('/stoptest chemistry')">OFF</button>
    <button class="btn bg-dark" onclick="handleAction('/cleartest chemistry')">Clear</button>
  </div>
  <div class="subject-row">
    <div class="subject-name"><i class="fas fa-dna" style="color:#f59e0b"></i> Biology</div>
    <button class="btn bg-green" onclick="handleAction('/starttest biology')">ON</button>
    <button class="btn bg-red" onclick="handleAction('/stoptest biology')">OFF</button>
    <button class="btn bg-dark" onclick="handleAction('/cleartest biology')">Clear</button>
  </div>
  <div class="subject-row">
    <div class="subject-name"><i class="fas fa-language" style="color:#ef4444"></i> English</div>
    <button class="btn bg-green" onclick="handleAction('/starttest english')">ON</button>
    <button class="btn bg-red" onclick="handleAction('/stoptest english')">OFF</button>
    <button class="btn bg-dark" onclick="handleAction('/cleartest english')">Clear</button>
  </div>
  <div class="subject-row">
    <div class="subject-name"><i class="fas fa-book-open" style="color:#ec4899"></i> Hindi</div>
    <button class="btn bg-green" onclick="handleAction('/starttest hindi')">ON</button>
    <button class="btn bg-red" onclick="handleAction('/stoptest hindi')">OFF</button>
    <button class="btn bg-dark" onclick="handleAction('/cleartest hindi')">Clear</button>
  </div>
</div>

<!-- 3. USER MANAGEMENT -->
<div class="card">
  <h3><i class="fas fa-user-shield"></i> User Management</h3>
  <div class="input-group">
    <label>Student Mobile Number</label>
    <input type="tel" id="userMobile" placeholder="10-digit number" maxlength="10">
  </div>
  <div class="grid-3">
    <button class="btn bg-green" onclick="userAction('/approve')">Approve</button>
    <button class="btn bg-red" onclick="userAction('/block')">Block</button>
    <button class="btn bg-blue" onclick="userAction('/unblock')">Unblock</button>
    <button class="btn bg-dark" onclick="userAction('/setname')">Set Name</button>
    <button class="btn bg-amber" onclick="userAction('/setpass')">Set Pass</button>
    <button class="btn bg-purple" onclick="userAction('/resetdevice')">Reset Dev</button>
  </div>
</div>

<!-- 4. TIMER & SETTINGS -->
<div class="card">
  <h3><i class="fas fa-clock"></i> Timer & Settings</h3>
  <div class="input-group">
    <label>Set Timer (Minutes)</label>
    <input type="number" id="timerMins" placeholder="e.g. 60" min="1">
  </div>
  <div class="grid">
    <button class="btn bg-blue btn-full" onclick="setTimer()"><i class="fas fa-clock"></i> Set Timer</button>
    <button class="btn bg-red btn-full" onclick="handleAction('/cleartime')"><i class="fas fa-clock-rotate-left"></i> Remove Timer</button>
    <button class="btn bg-green btn-full" onclick="handleAction('/negative on')"><i class="fas fa-minus-circle"></i> Negative ON</button>
    <button class="btn bg-red btn-full" onclick="handleAction('/negative off')"><i class="fas fa-ban"></i> Negative OFF</button>
  </div>
</div>

<!-- 5. ANNOUNCEMENTS -->
<div class="card">
  <h3><i class="fas fa-bullhorn"></i> Announcements</h3>
  <div class="input-group">
    <label>Notice Message</label>
    <input type="text" id="noticeMsg" placeholder="e.g. Aaj chhutti hai">
  </div>
  <button class="btn bg-amber btn-full" onclick="sendNotice()"><i class="fas fa-paper-plane"></i> Send Notice</button>
</div>

<!-- 6. APP LINKS SETUP -->
<div class="card">
  <h3><i class="fas fa-link"></i> App Links Setup</h3>
  <div class="input-group">
    <label>Paste Link Here</label>
    <input type="url" id="linkUrl" placeholder="https://...">
  </div>
  <div class="grid">
    <button class="btn bg-dark" onclick="setLink('/setncert')">NCERT</button>
    <button class="btn bg-dark" onclick="setLink('/setnotes')">Notes</button>
    <button class="btn bg-dark" onclick="setLink('/setpaid')">Paid</button>
    <button class="btn bg-dark" onclick="setLink('/setfree')">Free</button>
    <button class="btn bg-dark" onclick="setLink('/setbooks')">Books</button>
    <button class="btn bg-dark" onclick="setLink('/setbooktest')">Book Test</button>
    <button class="btn bg-dark" onclick="setLink('/settimetable')">Timetable</button>
    <button class="btn bg-dark" onclick="setLink('/setsocial')">Social</button>
    <button class="btn bg-blue btn-full" onclick="setLink('/setinvite')"><i class="fas fa-share-nodes"></i> Set Invite Link</button>
    <button class="btn bg-purple btn-full" onclick="setLink('/setbanner')"><i class="fas fa-image"></i> Set Banner Image</button>
  </div>
</div>

<!-- 7. CUSTOM COMMAND -->
<div class="card">
  <h3><i class="fas fa-terminal"></i> Custom Command</h3>
  <div class="input-group">
    <input type="text" id="customCmd" placeholder="Type any command...">
  </div>
  <button class="btn bg-blue btn-full" onclick="sendCustom()"><i class="fas fa-paper-plane"></i> Send Custom Command</button>
</div>

<div id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Copied!</span></div>

<script>
  const BOT_USERNAME = "Mathsmatic_bot";

  // Function to handle copy and open Telegram
  function handleAction(command) {
    // 1. Copy to clipboard
    copyToClipboard(command);
    
    // 2. Show Toast
    showToast('Copied: ' + command);

    // 3. Open Telegram with text (Some phones will auto-paste)
    setTimeout(() => {
      const url = `https://t.me/${BOT_USERNAME}?text=${encodeURIComponent(command)}`;
      window.open(url, '_blank');
    }, 300); // Small delay so toast shows
  }

  // Copy functionality (works on all mobiles)
  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(err => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { console.error('Copy failed', e); }
    document.body.removeChild(ta);
  }

  // Show Toast
  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.className = 'show';
    setTimeout(() => { t.className = ''; }, 2500);
  }

  // User Actions
  function userAction(prefix) {
    const mobile = document.getElementById('userMobile').value.trim();
    if(mobile.length !== 10) return alert("Sahi 10-digit mobile number daalo!");
    let cmd = `${prefix} ${mobile}`;
    
    if(prefix === '/setname') {
      const name = prompt("Naya naam kya rakhna hai?");
      if(!name) return;
      cmd += `|${name}`;
    }
    if(prefix === '/setpass') {
      const pass = prompt("Naya password kya rakhna hai? (min 6 characters)");
      if(!pass || pass.length < 6) return alert("Password 6 se zyada ka hona chahiye!");
      cmd += `|${pass}`;
    }
    handleAction(cmd);
  }

  // Timer
  function setTimer() {
    const mins = document.getElementById('timerMins').value;
    if(!mins || mins < 1) return alert("Sahi minutes daalo!");
    handleAction(`/settime ${mins}`);
  }

  // Notice
  function sendNotice() {
    const msg = document.getElementById('noticeMsg').value.trim();
    if(!msg) return alert("Message likho pehle!");
    handleAction(`/notice ${msg}`);
  }

  // Links
  function setLink(prefix) {
    const url = document.getElementById('linkUrl').value.trim();
    if(!url) return alert("Pehle link box me URL paste karo!");
    handleAction(`${prefix} ${url}`);
  }

  // Custom Command
  function sendCustom() {
    const cmd = document.getElementById('customCmd').value.trim();
    if(!cmd) return alert("Command likho pehle!");
    if(!cmd.startsWith('/')) return alert("Command / se start hona chahiye!");
    handleAction(cmd);
  }
</script>
</body>
</html>
